<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PalBook Live — معاينة التصميم / Design Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&family=Poppins:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ===================== Theme tokens ===================== */
  :root{
    --font-sans:'Poppins',system-ui,sans-serif;
    --font-ar:'Cairo','Tajawal',system-ui,sans-serif;
    --font-display:'Fredoka','Poppins',sans-serif;

    /* Sky + hills scene (day) */
    --sky-top:#74B9EE;
    --sky-mid:#A9D8F4;
    --sky-low:#D9EFFB;
    --hill-far:#CDE6A6;
    --hill-mid:#A8D381;
    --hill-near:#86C268;
    --cloud:#ffffff;

    --ink:#27384a;
    --ink-soft:#4d6175;
    --header-bg:rgba(255,255,255,.82);
    --header-border:rgba(255,255,255,.6);
    --chip-bg:#ffffff;
    --chip-border:#e2e8f0;
    --chip-ink:#33485c;

    /* Card gradient families (requested: pastel olive-green + blue) */
    --olive-a:#DCEAB6; --olive-b:#A9C97E;
    --blue-a:#C5E2F6;  --blue-b:#97C2EC;
    --card-ink:#2c3d2a;
    --card-ink-blue:#23384f;
    --card-surface:rgba(255,255,255,.92);
    --section-title:#1f4d3a;
  }
  html.dark{
    --sky-top:#0a1230;
    --sky-mid:#121d44;
    --sky-low:#1c2a55;
    --hill-far:#1d3b2b;
    --hill-mid:#163020;
    --hill-near:#0f2417;
    --cloud:#b9c6e8;

    --ink:#e8eef6;
    --ink-soft:#a9b7c9;
    --header-bg:rgba(15,23,42,.78);
    --header-border:rgba(148,163,184,.18);
    --chip-bg:#1e293b;
    --chip-border:#334155;
    --chip-ink:#e2e8f0;

    --olive-a:#3c4a28; --olive-b:#2a361c;
    --blue-a:#2b3c58;  --blue-b:#1d2b45;
    --card-ink:#e7f0d8;
    --card-ink-blue:#dce9f8;
    --card-surface:rgba(30,41,59,.92);
    --section-title:#9be3c2;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:var(--font-sans);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    transition:color .4s ease;
  }
  html[dir="rtl"] body{font-family:var(--font-ar)}

  /* ===================== Fixed sky/clouds/hills scene ===================== */
  .scene{position:fixed;inset:0;z-index:-2;overflow:hidden;transition:background .6s ease}
  .scene .sky{
    position:absolute;inset:0;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,var(--sky-low) 100%);
    transition:background .6s ease;
  }
  /* twinkling stars (dark only) */
  .stars{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 28% 8%,#fff,transparent),
      radial-gradient(2px 2px at 47% 22%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 63% 12%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 78% 26%,#fff,transparent),
      radial-gradient(2px 2px at 88% 9%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 36% 33%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 71% 38%,#fff,transparent);
  }
  html.dark .stars{opacity:.85}

  /* sun / moon */
  .orb{position:absolute;top:8%;inset-inline-end:9%;width:84px;height:84px;border-radius:50%;transition:all .6s ease}
  .orb.sun{background:radial-gradient(circle at 35% 35%,#FFF3B0,#FFD54A);box-shadow:0 0 50px 12px rgba(255,213,74,.55)}
  .orb.moon{opacity:0;background:radial-gradient(circle at 35% 35%,#f4f6ff,#cdd6f0);box-shadow:0 0 36px 8px rgba(205,214,240,.45)}
  html.dark .orb.sun{opacity:0}
  html.dark .orb.moon{opacity:1}

  /* clouds */
  .cloud{position:absolute;background:var(--cloud);border-radius:100px;filter:blur(.3px);opacity:.95;transition:opacity .6s ease}
  .cloud::before,.cloud::after{content:"";position:absolute;background:var(--cloud);border-radius:50%}
  .cloud::before{width:55%;height:140%;top:-50%;left:14%}
  .cloud::after{width:42%;height:115%;top:-32%;right:16%}
  html.dark .cloud{opacity:.10}
  .c1{width:150px;height:46px;top:20%;left:7%;animation:drift 34s linear infinite}
  .c2{width:110px;height:36px;top:24%;left:60%;animation:drift 46s linear infinite}
  .c3{width:190px;height:56px;top:27%;left:26%;animation:drift 58s linear infinite}
  .c4{width:90px;height:30px;top:34%;left:80%;animation:drift 40s linear infinite}
  @keyframes drift{0%{transform:translateX(0)}50%{transform:translateX(40px)}100%{transform:translateX(0)}}

  /* layered hills pinned to bottom */
  .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:42vh;min-height:280px}
  .hills svg{position:absolute;bottom:0;width:100%;height:100%}

  /* ===================== Header ===================== */
  .site-header{
    position:sticky;top:0;z-index:50;
    direction:ltr; /* keep language=left, theme=right physically in both languages */
    background:var(--header-bg);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--header-border);
    transition:background .4s ease,border-color .4s ease;
  }
  .header-inner{
    max-width:1120px;margin:0 auto;padding:10px 16px;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  }
  .zone-left{justify-self:start}
  .zone-center{justify-self:center}
  .zone-right{justify-self:end}

  .brand{display:flex;align-items:center;gap:10px}
  .brand img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15))}
  .brand .name{font-family:var(--font-display);font-weight:800;font-size:1.45rem;line-height:1;
    background:linear-gradient(90deg,#DC5A5E,#E8841A,#36A06E);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .name .live{color:#36A06E;-webkit-text-fill-color:#36A06E}
  .home-link{margin-inline-start:6px;font-weight:700;font-size:1rem;color:var(--ink);
    padding:6px 14px;border-radius:14px;white-space:nowrap;transition:background .2s}
  .home-link:hover{background:rgba(127,191,106,.18)}

  .chip{
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    padding:8px 14px;border-radius:16px;font-weight:700;font-size:.85rem;
    background:var(--chip-bg);border:2px solid var(--chip-border);color:var(--chip-ink);
    box-shadow:0 4px 14px rgba(0,0,0,.06);transition:transform .15s,border-color .2s,background .3s,color .3s;
  }
  .chip:hover{transform:translateY(-1px) scale(1.03);border-color:#86C268}
  .chip:active{transform:scale(.96)}
  .icon-btn{width:42px;height:42px;justify-content:center;padding:0;border-radius:14px}
  .chip svg{width:18px;height:18px}

  /* ===================== Layout ===================== */
  main{position:relative;z-index:1}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px}
  section{position:relative}

  /* Hero */
  .hero{padding:40px 16px 18px;text-align:center}
  .hero-img-box{display:flex;justify-content:center}
  .hero-img{
    width:33.333vw;            /* one third of page width on any device */
    max-width:33.333vw;
    min-width:150px;
    height:auto;
    animation:bob 4s ease-in-out infinite;
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.28));
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .hero h1{
    font-family:var(--font-display);font-weight:800;
    font-size:clamp(1.8rem,4.4vw,3rem);line-height:1.15;margin:18px 0 0;
    color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.4);
  }
  html.dark .hero h1{text-shadow:none}
  .hero p{font-size:clamp(1rem,2.3vw,1.25rem);color:var(--ink-soft);margin:12px auto 0;max-width:640px;line-height:1.7}

  /* Section heading */
  .sec-title{
    text-align:center;font-family:var(--font-display);font-weight:800;
    font-size:clamp(1.4rem,3.2vw,2rem);margin:0 0 26px;color:var(--section-title);
  }
  .sec-title .spark{font-size:.85em}
  .section-block{padding:46px 16px}

  /* Card rows — always centered */
  .cards{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}

  /* Explore cards (3) — same compact size as current design */
  .explore-card{
    width:300px;max-width:100%;text-align:start;cursor:pointer;border:none;
    border-radius:26px;padding:24px;color:var(--card-ink);position:relative;overflow:hidden;
    box-shadow:0 14px 30px -10px rgba(46,73,40,.4);
    transition:transform .25s ease,box-shadow .25s ease;
  }
  .explore-card:hover{transform:translateY(-8px) scale(1.025);box-shadow:0 22px 40px -12px rgba(46,73,40,.5)}
  .explore-card .bubble{position:absolute;top:-32px;inset-inline-end:-32px;width:112px;height:112px;background:rgba(255,255,255,.22);border-radius:50%}
  .explore-card .emoji{font-size:2.9rem;display:block;margin-bottom:10px}
  .explore-card h3{margin:0 0 6px;font-size:1.3rem;font-weight:800}
  .explore-card p{margin:0 0 14px;font-size:.92rem;opacity:.92}
  .explore-card .go{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.92rem}
  .go .arrow{transition:transform .2s}
  html[dir="rtl"] .go .arrow{transform:scaleX(-1)}
  .explore-card:hover .go .arrow{transform:translateX(4px)}
  html[dir="rtl"] .explore-card:hover .go .arrow{transform:scaleX(-1) translateX(4px)}

  /* gradient families */
  .g-olive{background:linear-gradient(135deg,var(--olive-a),var(--olive-b));color:var(--card-ink)}
  .g-blue{background:linear-gradient(135deg,var(--blue-a),var(--blue-b));color:var(--card-ink-blue)}

  /* Why cards (4) */
  .why-card{
    width:240px;max-width:100%;border-radius:24px;padding:24px;text-align:center;
    background:var(--card-surface);
    box-shadow:0 12px 28px -12px rgba(30,60,45,.3);
    transition:transform .25s ease,box-shadow .25s ease;
  }
  .why-card:hover{transform:translateY(-10px);box-shadow:0 20px 36px -14px rgba(30,60,45,.42)}
  .why-card .badge{
    width:64px;height:64px;border-radius:20px;margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;font-size:1.9rem;
    box-shadow:0 8px 18px -6px rgba(0,0,0,.2);
  }
  .why-card h3{margin:0 0 6px;font-size:1.12rem;font-weight:800;color:var(--ink)}
  .why-card p{margin:0;font-size:.9rem;color:var(--ink-soft)}

  /* ===================== Footer (kept as-is from current site) ===================== */
  footer{margin-top:40px;position:relative;z-index:1;
    background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);color:#cbd5e1}
  .flag-stripe{height:5px;display:flex}
  .flag-stripe div{flex:1}
  .fr{background:#F69C9E}.fw{background:#fff}.fg{background:#97E3C2}.fb{background:#3A3A3A}
  .footer-inner{max-width:1120px;margin:0 auto;padding:40px 24px}
  .footer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-bottom:28px}
  .footer-brand{display:flex;align-items:center;gap:10px}
  .footer-brand img{width:40px;height:40px;object-fit:contain}
  .footer-brand .name{font-family:var(--font-display);font-weight:800;font-size:1.3rem;
    background:linear-gradient(90deg,#F8B8BA,#FFD09A,#97E3C2);-webkit-background-clip:text;background-clip:text;color:transparent}
  footer h4{color:#fff;margin:0 0 12px;font-size:1rem}
  footer p{font-size:.85rem;color:#94a3b8;line-height:1.7;margin:8px 0 0}
  footer ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
  footer a{color:#cbd5e1;text-decoration:none;font-size:.88rem;transition:color .2s}
  footer a:hover{color:#FFBA6F}
  .footer-bottom{border-top:1px solid #334155;padding-top:22px;text-align:center;font-size:.78rem;color:#94a3b8}
  @media(max-width:720px){.footer-grid{grid-template-columns:1fr;text-align:center}.footer-brand{justify-content:center}}

  /* Preview badge */
  .preview-badge{
    position:fixed;inset-block-end:14px;inset-inline-start:14px;z-index:60;
    background:rgba(15,23,42,.85);color:#fff;font-size:.74rem;font-weight:700;
    padding:7px 13px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.3);
    backdrop-filter:blur(6px);display:flex;align-items:center;gap:7px;direction:rtl
  }
  .preview-badge b{color:#FFD09A}
</style>
</head>

  let lang = 'ar';
  function applyLang(l){
    lang = l;
    const t = I18N[l];
    document.documentElement.lang = l;
    document.documentElement.dir = t.dir;
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const k = el.getAttribute('data-i18n');
      if(t[k]!==undefined) el.textContent = t[k];
    });
    document.querySelectorAll('.go .arrow').forEach(a=>a.textContent=t.arrow);
    document.getElementById('langLabel').textContent = t.langLabel;
  }
  document.getElementById('langBtn').addEventListener('click',()=>applyLang(lang==='ar'?'en':'ar'));

  // Theme
  function applyTheme(dark){
    document.documentElement.classList.toggle('dark',dark);
    document.getElementById('iconMoon').style.display = dark?'none':'block';
    document.getElementById('iconSun').style.display = dark?'block':'none';
  }
  document.getElementById('themeBtn').addEventListener('click',()=>{
    applyTheme(!document.documentElement.classList.contains('dark'));
  });

  applyLang('ar');
  applyTheme(false);
</script>
